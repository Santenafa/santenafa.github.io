<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Rogue</title>
</head>
<body>
    <style>
        canvas{
            outline: 1px solid indigo;
        }
        body{
            background-color: black;
            text-align: center;
            margin-top: 50px;
        }
    </style>
    <canvas></canvas>
    <script src="src/game.js"></script>
    <script src="src/draw.js"></script>
    <script src="src/score.js"></script>
    <script src="src/map.js"></script>
    <script src="src/tile.js"></script>
    <script src="src/monster.js"></script>
    <script src="src/util.js"></script>
    <script src="src/spell.js"></script>
    <script src="src/sounds.js"></script>
    <script>
        //Game settings
        tileSize = 64;
        numTiles = 9;

        uiWidth = 4;
        level = 1;
        maxHp = 6;
        startingHp = 3;
        numLevels = 6;
        wasCoinPicked = false;
        maxSpells = 9;
        // Screen shake
        shakeAmount = 0;       
        shakeX = 0;             
        shakeY = 0;

        canvas = document.querySelector("canvas");
        ctx = canvas.getContext("2d");

        spriteSheet = new Image();
        spriteSheet.src = 'assets/spriteSheet.png';
        spriteSheet.onload = showTitle;

        gameState = new LoadingState();
        
        document.querySelector("html").onkeydown = function(e){
            gameState.onKeyDown(e);
        };

        setInterval(function(){
            gameState.draw();
        }, 20);

        canvas.width = tileSize * (numTiles + uiWidth);
        canvas.height = tileSize * numTiles;
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
        ctx.imageSmoothingEnabled = false;

        initSounds();
    </script>
</body>
</html>
